# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/refs/heads/main/schemas/v1.0/azure.yaml.json

name: basic-foundry-agent
metadata:
  template: azd-init@1.21.0

services:
  # A Foundry project IS the service. Everything Foundry-related -- model
  # deployments, connections, toolboxes, skills, routines, and the agents
  # themselves -- nests under this single entry's `config:` block.
  #
  # New host kind: `microsoft.foundry`. The extension's service-target
  # owns the full lifecycle (provision the Foundry project, reconcile
  # project state, build + push each agent's code, post agent definitions).
  agent-project:
    host: microsoft.foundry
    config:
      deployments:
        - name: gpt-4.1-mini
          model:
            format: OpenAI
            name: gpt-4.1-mini
            version: "2025-04-14"
          sku:
            name: GlobalStandard
            capacity: 10

      agents:
        # Hosted agent: definition + code/build colocated in the same entry.
        # No separate services: entry, no link field.
        basic-agent:
          kind: hosted
          description: A basic Agent Framework agent hosted by Foundry.
          project: src/basic-agent
          docker:
            path: Dockerfile
            remoteBuild: true
          protocols:
            - { protocol: responses, version: "1.0.0" }
          startupCommand: python main.py
          env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-4.1-mini
          container:
            resources:
              cpu: "0.25"
              memory: "0.5Gi"
