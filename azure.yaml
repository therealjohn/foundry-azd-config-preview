# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/refs/heads/main/schemas/v1.0/azure.yaml.json

name: basic-foundry-agent
metadata:
  template: azd-init@1.21.0

# The new top-level `foundry:` section. Owned by the azure.ai.agents
# extension's published schema. Contains everything that maps to Foundry
# data-plane APIs.
foundry:
  # Model deployments created on the Foundry project at provision time.
  deployments:
    - name: gpt-4.1-mini
      model:
        format: OpenAI
        name: gpt-4.1-mini
        version: "2025-04-14"
      sku:
        name: GlobalStandard
        capacity: 10

  # All agent definitions live here. Maps directly to Foundry's
  # createAgentVersion API contract. This is the source of truth for what
  # the agent IS to Foundry.
  agents:
    basic-agent:
      kind: hosted
      description: A basic Agent Framework agent hosted by Foundry.
      protocols:
        - { protocol: responses, version: "1.0.0" }
      env:
        AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-4.1-mini

# The `services:` section keeps doing what it is good at: source directory,
# build mode (docker: vs runtime:), packaging, deploy. Only present for
# code-bearing agents.
services:
  basic-agent-code:
    project: src/basic-agent
    host: azure.ai.agent
    runtime:
      stack: python
      version: "3.12"
    docker:
      path: Dockerfile
      remoteBuild: true
    config:
      # L2 link: this service backs the foundry.agents.basic-agent definition.
      # On `azd deploy basic-agent-code`, the extension builds + pushes the
      # container, then posts the agent definition to Foundry's
      # createAgentVersion API.
      agent: basic-agent
      container:
        resources:
          cpu: "0.25"
          memory: "0.5Gi"
