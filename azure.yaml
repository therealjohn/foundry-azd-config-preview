# yaml-language-server: $schema=https://raw.githubusercontent.com/therealjohn/foundry-azd-config-preview/main/schemas/azure.yaml.json

name: customer-support-platform
metadata:
  template: azd-init@1.21.0

services:
  # =============================================================================
  # The Foundry project IS the service. Everything Foundry-scoped is a direct
  # property of this entry. This branch demonstrates BOTH inline definitions
  # (small ones) AND data-side `$ref:` imports (large ones split into their
  # own files under agents/, toolboxes/, skills/).
  # =============================================================================
  support-platform:
    host: microsoft.foundry

    # ---- Model deployments (all inline -- small entries) ----
    deployments:
      - model:
          format: OpenAI
          name: gpt-4.1
          version: "2025-04-14"
        name: gpt-4.1
        sku:
          capacity: 50
          name: GlobalStandard
      - model:
          format: OpenAI
          name: gpt-4.1-mini
          version: "2025-04-14"
        name: gpt-4.1-mini
        sku:
          capacity: 20
          name: GlobalStandard
      - model:
          format: OpenAI
          name: text-embedding-3-small
          version: "1"
        name: text-embedding-3-small
        sku:
          capacity: 10
          name: Standard

    # ---- Project connections (all inline) ----
    connections:
      - name: github-mcp-conn
        category: CustomKeys
        target: https://api.githubcopilot.com/mcp
        authType: CustomKeys
        credentials:
          x-api-key: ${GITHUB_MCP_TOKEN}
        metadata:
          type: custom_MCP

      - name: tavily-mcp-conn
        category: ApiKey
        target: https://mcp.tavily.com/mcp
        authType: ApiKey
        credentials:
          key: ${TAVILY_API_KEY}
        metadata:
          type: custom_MCP

      - name: azure-search-conn
        category: CognitiveSearch
        target: https://my-search-svc.search.windows.net
        authType: ProjectManagedIdentity

    # ---- Toolboxes ----
    # support-toolbox stays inline (small).
    # research-toolbox is split into its own file (connection-backed tools
    # listed in one place, easier to review independently).
    toolboxes:
      - name: support-toolbox
        tools:
          - type: web_search
          - type: code_interpreter
          - type: file_search

      - $ref: ./toolboxes/research-toolbox.yaml

    # ---- Skills ----
    # triage stays inline; code-review is extracted (longer + has tools list).
    skills:
      - name: triage
        description: Routes customer questions to specialist agents
        instructions: ./prompts/triage.md

      - $ref: ./skills/code-review.yaml

    # ---- Routines (inline) ----
    routines:
      - name: nightly-ticket-summary
        description: Summarize overnight support tickets each morning at 8am UTC
        trigger:
          type: schedule
          cron: "0 8 * * *"
        agent: summarizer-agent
        input:
          ticket_source: ${TICKET_SOURCE_URL}

    # ---- Agents ----
    # Prompt agents stay inline (small).
    # Hosted agents -- which carry runtime config + container settings +
    # protocols -- are split into their own files. Easier to review per-agent
    # changes; the agent file can be schema-validated standalone.
    agents:
      - name: triage-agent
        kind: prompt
        description: Routes customer questions to the right specialist agent
        instructions: |
          You are a triage agent for a customer support platform.
          Read the user's question and decide which specialist should
          handle it. Available agents:
            - support-agent:  general product questions
            - research-agent: questions requiring deep research
          Respond with JSON: {"route": "<agent-name>", "reason": "..."}
        env:
          FOUNDRY_MODEL_DEPLOYMENT_NAME: gpt-4.1-mini

      - name: summarizer-agent
        kind: prompt
        description: Summarizes a batch of support tickets into actionable insights
        skill: triage
        env:
          FOUNDRY_MODEL_DEPLOYMENT_NAME: gpt-4.1-mini

      - $ref: ./agents/support-agent.yaml
      - $ref: ./agents/research-agent.yaml

  # =============================================================================
  # Non-Foundry service: customer-facing chat UI.
  # =============================================================================
  webapp:
    project: src/webapp
    host: containerapp
    language: js
    docker:
      path: Dockerfile
      remoteBuild: true
    uses: [support-platform]
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${FOUNDRY_PROJECT_ENDPOINT}
      SUPPORT_AGENT_NAME: support-agent
      RESEARCH_AGENT_NAME: research-agent
      TRIAGE_AGENT_NAME: triage-agent
