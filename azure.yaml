# yaml-language-server: $schema=https://raw.githubusercontent.com/therealjohn/foundry-azd-config-preview/main/schemas/azure.yaml.json

name: basic-foundry-agent
metadata:
  template: azd-init@1.21.0

services:
  # A Foundry project IS the service. Everything Foundry-related -- model
  # deployments, connections, toolboxes, skills, routines, and the agents
  # themselves -- lives directly under this single entry, no `config:`
  # indirection. Field shapes for deployments/connections/toolboxes match
  # the existing `azure.ai.agent.json` extension schema.
  agent-project:
    host: microsoft.foundry

    deployments:
      - model:
          format: OpenAI
          name: gpt-4.1-mini
          version: "2025-04-14"
        name: gpt-4.1-mini
        sku:
          capacity: 10
          name: GlobalStandard

    agents:
      # Hosted agent: definition + code/build colocated in the same entry.
      # No separate services: entry, no link field.
      - name: basic-agent
        kind: hosted
        description: A basic Agent Framework agent hosted by Foundry.
        project: src/basic-agent
        docker:
          path: Dockerfile
          remoteBuild: true
        protocols:
          - protocol: responses
            version: "1.0.0"
        startupCommand: python main.py
        env:
          FOUNDRY_MODEL_DEPLOYMENT_NAME: gpt-4.1-mini
        container:
          resources:
            cpu: "0.25"
            memory: 0.5Gi
